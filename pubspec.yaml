name: encrypted_shopping_app
description: "Gemeinsame Einkaufsliste mit privatem GitHub-Repo als verschlüsseltem Backend."
publish_to: 'none'

# Version wird im Release-Build aus dem Git-Tag überschrieben.
version: 0.1.4+5

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  http: ^1.2.0
  path_provider: ^2.1.4
  package_info_plus: ^8.0.0
  uuid: ^4.4.0
  intl: any
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^22.0.0
  workmanager: ^0.10.10
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/piktos/
